services:
  postgres:
    ports: !reset []
  canton:
    environment:
      CANTON_PAYMENT_LOCAL_SECRET: ${CANTON_PAYMENT_LOCAL_SECRET:?Start LocalNet via the demo script}
    volumes:
      - ${CANTON_LOCALNET_OVERRIDES}/canton-auth.conf:/app/app-user/on/app-auth.conf:ro
    ports: !override
      - 127.0.0.1:2975:2975
  splice:
    environment:
      CANTON_PAYMENT_LOCAL_SECRET: ${CANTON_PAYMENT_LOCAL_SECRET:?Start LocalNet via the demo script}
    volumes:
      - ${CANTON_LOCALNET_OVERRIDES}/splice-auth.conf:/app/app-user/on/app-auth.conf:ro
    ports: !override
      - 127.0.0.1:2903:2903
      - 127.0.0.1:5012:5012
