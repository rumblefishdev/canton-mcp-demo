name: canton-mcp-demo

x-demo: &demo
  image: canton-mcp-demo:local
  build:
    context: .
    target: demo
  environment:
    CANTON_RELEASE: /canton-runtime
    CANTON_LEDGER_URL: http://canton:7373
    CANTON_REVIEW_COMMAND: docker compose run --rm operator review
  volumes:
    - canton-runtime:/canton-runtime:ro
    - demo-state:/app/.state
  depends_on:
    canton:
      condition: service_healthy

services:
  canton:
    build:
      context: .
      target: canton
    volumes:
      - canton-runtime:/runtime
    healthcheck:
      test: [CMD-SHELL, 'test -s /runtime/synchronizer_id && wget -qO /dev/null http://127.0.0.1:7373/livez']
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
  mcp:
    <<: *demo
    command: [node, dist/server.js]
  operator:
    <<: *demo
    entrypoint: [node, dist/operator.js]
    environment:
      CANTON_RELEASE: /canton-runtime
      CANTON_LEDGER_URL: http://canton:7373
      CANTON_SIGNER_DIRECTORY: /app/.signer
    volumes:
      - canton-runtime:/canton-runtime:ro
      - demo-state:/app/.state
      - signer-state:/app/.signer

volumes:
  canton-runtime:
  demo-state:
  signer-state:
